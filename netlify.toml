[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ---- Adresse technique Netlify -> domaine principal (référencement) ----
# Évite que Google voie deux copies du site (…netlify.app et aven-co.com).
[[redirects]]
  from = "https://strong-bavarois-af02f3.netlify.app/*"
  to = "https://aven-co.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ---- Mode temporaire « à recontacter » (formulaire d'inscription) ----
# inscription.html EST directement la version temporaire (pas de redirection ici :
# une redirection s'est révélée peu fiable). La version normale, avec Date et
# Créneau, est archivée dans normal/inscription-normale.html. Voir
# temporaire/LISEZ-MOI.md pour la remettre en place le moment venu.
